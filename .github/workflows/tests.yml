name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Run tests
      env:
        SMU_BLUEPRINT: owner/repo
        SMU_BLUEPRINT_BRANCH: main
      run: |
        python -m unittest discover -s tests -t . -v
        python scripts/prompt_contract.py --local
        python scripts/preset_contract.py
        python scripts/generate-prompt-adapters.py --check-templates
        python smu.py profile resolve
        python smu.py profile doctor
        python smu.py adapter list
        python smu.py adapter materialize --dry-run
        HOME="$RUNNER_TEMP/smu-home" python smu.py adapter init ci-shell
        HOME="$RUNNER_TEMP/smu-home" python smu.py catalog package ci-shell --output "$RUNNER_TEMP/ci-shell.smu-pack"
        mkdir -p "$RUNNER_TEMP/catalog-registry/packs"
        cp -R "$RUNNER_TEMP/ci-shell.smu-pack" "$RUNNER_TEMP/catalog-registry/packs/ci-shell.smu-pack"
        printf 'schema_version = 1\n[packs.ci-shell]\nname = "CI Shell"\nsource = "packs/ci-shell.smu-pack"\n' > "$RUNNER_TEMP/catalog-registry/index.toml"
        HOME="$RUNNER_TEMP/smu-home-registry" python smu.py catalog registry add local "$RUNNER_TEMP/catalog-registry"
        HOME="$RUNNER_TEMP/smu-home-registry" python smu.py catalog search ci
        HOME="$RUNNER_TEMP/smu-home-registry" python smu.py catalog install ci-shell --dry-run
        HOME="$RUNNER_TEMP/smu-home-install" python smu.py catalog install "$RUNNER_TEMP/ci-shell.smu-pack" --dry-run
        HOME="$RUNNER_TEMP/smu-home" python smu.py catalog migrate --dry-run
        HOME="$RUNNER_TEMP/smu-home" python smu.py catalog doctor

    - name: Run tests with pytest (if available)
      env:
        SMU_BLUEPRINT: owner/repo
        SMU_BLUEPRINT_BRANCH: main
      run: |
        pip install pytest 2>/dev/null || true
        pytest tests/ -v 2>/dev/null || python -m unittest discover -s tests -t . -v
        python scripts/prompt_contract.py --local
        python scripts/preset_contract.py
        python scripts/generate-prompt-adapters.py --check-templates
        python smu.py profile resolve
        python smu.py profile doctor
        python smu.py adapter list
        python smu.py adapter materialize --dry-run
        HOME="$RUNNER_TEMP/smu-home-pytest" python smu.py adapter init ci-shell
        HOME="$RUNNER_TEMP/smu-home-pytest" python smu.py catalog package ci-shell --output "$RUNNER_TEMP/ci-shell-pytest.smu-pack"
        mkdir -p "$RUNNER_TEMP/catalog-registry-pytest/packs"
        cp -R "$RUNNER_TEMP/ci-shell-pytest.smu-pack" "$RUNNER_TEMP/catalog-registry-pytest/packs/ci-shell.smu-pack"
        printf 'schema_version = 1\n[packs.ci-shell]\nname = "CI Shell"\nsource = "packs/ci-shell.smu-pack"\n' > "$RUNNER_TEMP/catalog-registry-pytest/index.toml"
        HOME="$RUNNER_TEMP/smu-home-pytest-registry" python smu.py catalog registry add local "$RUNNER_TEMP/catalog-registry-pytest"
        HOME="$RUNNER_TEMP/smu-home-pytest-registry" python smu.py catalog search ci
        HOME="$RUNNER_TEMP/smu-home-pytest-registry" python smu.py catalog install ci-shell --dry-run
        HOME="$RUNNER_TEMP/smu-home-pytest-install" python smu.py catalog install "$RUNNER_TEMP/ci-shell-pytest.smu-pack" --dry-run
        HOME="$RUNNER_TEMP/smu-home-pytest" python smu.py catalog migrate --dry-run
        HOME="$RUNNER_TEMP/smu-home-pytest" python smu.py catalog doctor

  markdown-lint:
    name: Markdown Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - uses: actions/checkout@v4

    - name: Lint Markdown files
      uses: DavidAnson/markdownlint-cli2-action@v14
      with:
        globs: |
          **/*.md

  flox-smoke-test:
    name: Flox manifest smoke test
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - uses: actions/checkout@v4

    - name: Install Flox
      uses: flox/install-flox-action@main

    - name: Verify pinned toolchain activates
      env:
        SMU_BLUEPRINT: owner/repo
        SMU_BLUEPRINT_BRANCH: main
      run: |
        flox activate -- bash -c '
          set -euo pipefail
          echo "Toolchain versions inside flox activate:"
          python3 --version
          pytest --version
          shellcheck --version
          node --version
          git --version
        '
