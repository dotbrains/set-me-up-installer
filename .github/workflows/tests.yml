name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Run tests
      env:
        SMU_BLUEPRINT: owner/repo
        SMU_BLUEPRINT_BRANCH: main
      run: |
        pip install pytest 2>/dev/null || true
        PYTHON=python scripts/validate.sh --python

  markdown-lint:
    name: Markdown Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - uses: actions/checkout@v5

    - name: Lint Markdown files
      uses: DavidAnson/markdownlint-cli2-action@v14
      with:
        globs: |
          **/*.md

  flox-smoke-test:
    name: Flox manifest smoke test
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - uses: actions/checkout@v5

    - name: Install Flox
      uses: flox/install-flox-action@main

    - name: Verify pinned toolchain activates
      env:
        SMU_BLUEPRINT: owner/repo
        SMU_BLUEPRINT_BRANCH: main
      run: |
        flox activate -- bash -c '
          set -euo pipefail
          echo "Toolchain versions inside flox activate:"
          python3 --version
          pytest --version
          scripts/validate.sh --shell
          node --version
          git --version
        '
