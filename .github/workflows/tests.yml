name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Run tests
      env:
        SMU_BLUEPRINT: owner/repo
        SMU_BLUEPRINT_BRANCH: main
      run: |
        python -m unittest discover -s tests -t . -v
        python scripts/prompt_contract.py --local
        python scripts/preset_contract.py
        python scripts/generate-prompt-adapters.py --check-templates
        python smu.py profile resolve
        python smu.py profile doctor
        python smu.py adapter list

    - name: Run tests with pytest (if available)
      env:
        SMU_BLUEPRINT: owner/repo
        SMU_BLUEPRINT_BRANCH: main
      run: |
        pip install pytest 2>/dev/null || true
        pytest tests/ -v 2>/dev/null || python -m unittest discover -s tests -t . -v
        python scripts/prompt_contract.py --local
        python scripts/preset_contract.py
        python scripts/generate-prompt-adapters.py --check-templates
        python smu.py profile resolve
        python smu.py profile doctor
        python smu.py adapter list

  markdown-lint:
    name: Markdown Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - uses: actions/checkout@v4

    - name: Lint Markdown files
      uses: DavidAnson/markdownlint-cli2-action@v14
      with:
        globs: |
          **/*.md

  flox-smoke-test:
    name: Flox manifest smoke test
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
    - uses: actions/checkout@v4

    - name: Install Flox
      uses: flox/install-flox-action@main

    - name: Verify pinned toolchain activates
      env:
        SMU_BLUEPRINT: owner/repo
        SMU_BLUEPRINT_BRANCH: main
      run: |
        flox activate -- bash -c '
          set -euo pipefail
          echo "Toolchain versions inside flox activate:"
          python3 --version
          pytest --version
          shellcheck --version
          node --version
          git --version
        '
